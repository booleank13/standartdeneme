<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=0">
    <title>Carvak 3D Cube</title>
    <style>
        /* CSS Reset & Basic Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            overflow: hidden;
            user-select: none;
        }

        /* Branding Colors */
        :root {
            --carvak-blue: #1C1F37; /* Approximate Dark Navy/Black from Carvak/Kavak */
            --carvak-green: #00cc66; /* Approximate Green */
            --carvak-white: #ffffff;
            --carvak-gray: #f5f5f5;
        }

        #container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 480px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        #cubeContainer {
            width: 320px;
            height: 480px;
            position: absolute;
            top: 0;
            left: 0;
            /* Perspective is set in JS but good to have fallback */
            perspective: 960px;
            transform-style: preserve-3d;
        }

        #cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            /* Transition set by JS class */
        }

        .easeInOut {
            transition: transform 1s ease-in-out;
        }

        .easeOut {
            transition: transform 0.5s ease-out;
        }

        side {
            position: absolute;
            width: 320px;
            height: 480px;
            background-color: white;
            backface-visibility: visible; /* Important for seeing back of sides if transparent */
            /* Border for debugging/separation */
            border: 1px solid #ddd;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Face Styling */
        .face-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo-text {
            font-size: 3em;
            font-weight: 800;
            color: var(--carvak-white);
            z-index: 2;
        }

        .cta-text {
            font-size: 2em;
            font-weight: 700;
            color: var(--carvak-white);
            margin-top: 20px;
            z-index: 2;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 1.2em;
            color: var(--carvak-white);
            margin-top: 10px;
            z-index: 2;
        }

        .bg-gradient-blue {
            background: linear-gradient(135deg, var(--carvak-blue) 0%, #000 100%);
        }

        .bg-gradient-green {
            background: linear-gradient(135deg, var(--carvak-green) 0%, #00994d 100%);
        }

        .bg-white {
            background-color: white;
        }

        /* Arrows */
        .arrow {
            position: absolute;
            top: 50%;
            width: 30px;
            height: 30px;
            border-top: 4px solid rgba(0,0,0,0.3);
            border-right: 4px solid rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 100;
            transform: translateY(-50%);
            transition: all 0.2s;
        }
        .arrow:hover {
            border-color: rgba(0,0,0,0.6);
        }

        #arrowLeft {
            left: 10px;
            transform: translateY(-50%) rotate(-135deg);
        }

        #arrowRight {
            right: 10px;
            transform: translateY(-50%) rotate(45deg);
        }

        /* Swipe Icon Animation */
        #swipeIcon {
            position: absolute;
            top: 60%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 101;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #swipeIcon::after {
            content: '↔'; /* Simple arrow char */
            font-size: 30px;
            color: #333;
        }

        #swipeIcon.active {
            opacity: 1;
            animation: swipeAnim 2s infinite ease-in-out;
        }

        @keyframes swipeAnim {
            0% { transform: translate(-50%, -50%) translateX(-30px); }
            50% { transform: translate(-50%, -50%) translateX(30px); }
            100% { transform: translate(-50%, -50%) translateX(-30px); }
        }

        /* Overlay */
        #overlay {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background-color: black; opacity: 0; pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Button style */
        .btn {
            background-color: var(--carvak-green);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-blue {
            background-color: var(--carvak-blue);
        }

    </style>
</head>
<body>

    <div id="container">
        <div id="swipeIcon"></div>
        <div id="cubeContainer">
            <div id="cube" class="easeInOut">
                <!-- Front: Carvak Brand -->
                <side id="front">
                    <div class="face-content bg-gradient-blue">
                        <div class="logo-text">CARVAK</div>
                        <div class="sub-text">Arabanı En İyi Fiyata Sat</div>
                        <div class="arrow-hint" style="position:absolute; bottom:20px; color:rgba(255,255,255,0.5); font-size:12px;">Çevirmek için kaydırın</div>
                    </div>
                </side>

                <!-- Right: Buy Car -->
                <side id="right">
                    <div class="face-content bg-white">
                        <div class="logo-text" style="color:var(--carvak-blue)">AL</div>
                        <div class="sub-text" style="color:#666">Yüzlerce sertifikalı araç</div>
                        <a href="#" class="btn btn-blue">Araçları İncele</a>
                    </div>
                </side>

                <!-- Back: Sell Car -->
                <side id="back">
                    <div class="face-content bg-gradient-green">
                        <div class="logo-text">SAT</div>
                        <div class="sub-text">Hemen teklif al</div>
                        <a href="#" class="btn btn-blue">Fiyatını Öğren</a>
                    </div>
                </side>

                <!-- Left: Finance/Promo -->
                <side id="left">
                    <div class="face-content bg-gradient-blue">
                        <div class="logo-text">KREDİ</div>
                        <div class="sub-text">Sana özel oranlar</div>
                        <a href="#" class="btn">Başvur</a>
                    </div>
                </side>
            </div>
        </div>

        <div id="arrowLeft" class="arrow"></div>
        <div id="arrowRight" class="arrow"></div>
        <div id="overlay"></div>
    </div>

    <script>
        // Global Variables
        var adWidth = 320, adHeight = 480;
        var centerH, centerV, perspective, downScale;
        var container, cubeContainer, cube, swipeIcon, arrowLeft, arrowRight;
        var angle = 0;
        var speedX = 0, speedY = 0;
        var mouseX = 0, mouseY = 0, oldMouseX = 0, oldMouseY = 0;
        var touching = false, introDone = false, tilt = false;
        var touchDevice;
        var startEventType = "mousedown", endEventType = "mouseup", moveEventType = "mousemove", moveOutEventType = "mouseleave";
        var autoRotateInterval;
        var iconActive = false;
        var swipeTimeout;

        function init() {
            container = document.getElementById("container");
            cubeContainer = document.getElementById("cubeContainer");
            swipeIcon = document.getElementById("swipeIcon");
            cube = document.getElementById("cube");
            arrowLeft = document.getElementById("arrowLeft");
            arrowRight = document.getElementById("arrowRight");

            // Event Listeners for Arrows
            arrowLeft.onclick = function () {
                if (introDone) {
                    hideSwipeIcon();
                    stopAutoRotate();
                    angle -= 90;
                    applyTransform();
                    // countSide(); // Removed tracking
                }
            };
            arrowRight.onclick = function () {
                if (introDone) {
                    hideSwipeIcon();
                    stopAutoRotate();
                    angle += 90;
                    applyTransform();
                    // countSide(); // Removed tracking
                }
            };

            // Touch Detection
            touchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
            if (touchDevice) {
                startEventType = "touchstart";
                endEventType = "touchend";
                moveEventType = "touchmove";
                moveOutEventType = "touchcancel"; // Better than mouseleave for touch
            }

            // Bind Events to Container
            container.addEventListener(startEventType, onPress, {passive: false});
            window.addEventListener(endEventType, onRelease); // Window to catch release outside
            window.addEventListener(moveEventType, onMove, {passive: false});

            // Setup Cube
            constructCube(adWidth, adHeight);

            // Features
            includeTiltMode();
            includeResizeMode();

            // Start
            startIntro();
            showSwipeIcon();
        }

        function constructCube(w, h) {
            adWidth = w;
            adHeight = h;
            centerH = adWidth / 2;
            centerV = adHeight / 2;
            perspective = 2 * adHeight;
            downScale = 0.85;

            container.style.width = adWidth + "px";
            container.style.height = adHeight + "px";

            cubeContainer.style.perspective = perspective + "px";
            cubeContainer.style.webkitPerspective = perspective + "px";

            // Swipe Icon Positioning
            // swipeIcon.style.left = (adWidth / 2) + "px"; // Centered in CSS

            var sides = ["front", "back", "left", "right"];
            var rotations = [0, 180, 270, 90];

            for (var i = 0; i < sides.length; i++) {
                var el = document.getElementById(sides[i]);
                if(el) {
                    el.style.transform = "rotateY(" + rotations[i] + "deg) translateZ(" + centerH + "px)";
                    el.style.webkitTransform = "rotateY(" + rotations[i] + "deg) translateZ(" + centerH + "px)";
                }
            }
        }

        function applyTransform() {
            var transform = "translateZ(-" + centerH + "px) rotateY(" + angle + "deg)";
            cube.style.transform = transform;
            cube.style.webkitTransform = transform;
        }

        function setTransitionDuration(seconds) {
            cube.style.transitionDuration = seconds + "s";
            cube.style.webkitTransitionDuration = seconds + "s";
        }

        function onPress(e) {
            if (introDone) {
                var t = e;
                if (e.touches) t = e.touches[0];

                touching = true;
                speedX = 0;
                speedY = 0;
                oldMouseX = t.pageX;
                oldMouseY = t.pageY;

                cubeScale(downScale, 0.2);
                setTransitionDuration(0);
                hideSwipeIcon();
                stopAutoRotate();
            }
        }

        function onRelease(e) {
            if (introDone && touching) {
                touching = false;

                // Snap to nearest 90
                angle += speedX;
                var snap = 90;
                var n = Math.round(angle / snap); // Use round instead of floor logic from reference for better snapping
                var targetAngle = n * snap;

                // If speed was high, maybe jump to next?
                // The reference logic:
                // var n = 1 + Math.floor(angle / t), o = t * n; ...

                // Simplified snapping logic:
                angle = targetAngle;

                cubeScale(1, 0.4);

                // Dynamic duration based on speed
                var duration = Math.abs(speedX) / 6;
                if (duration < 0.2) duration = 0.5;

                setTransitionDuration(duration); // Simple fixed duration
                applyTransform();
                showSwipeIcon();
            }
        }

        function onMove(e) {
            if (introDone && touching) {
                var t = e;
                if (e.touches) t = e.touches[0];

                mouseX = t.pageX;
                mouseY = t.pageY;
                speedX = mouseX - oldMouseX;
                speedY = mouseY - oldMouseY;

                // Prevent scrolling if moving horizontally
                if (Math.abs(speedX) > Math.abs(speedY)) {
                    e.preventDefault();
                }

                angle += speedX / 3; // Sensitivity
                applyTransform();

                oldMouseX = mouseX;
                oldMouseY = mouseY;
            }
        }

        function startIntro() {
            // Initial spin
            applyTransform();

            // Step 1: Tilt slightly
            setTimeout(function () {
                setTransitionDuration(0.5);
                angle = -45;
                applyTransform();
                cubeScale(downScale, 0.3);
            }, 500);

            // Step 2: Spin full circle
            setTimeout(function () {
                cubeScale(1, 1.5);
                setTransitionDuration(1.3);
                angle = 360; // Full spin
                applyTransform();
            }, 1200);

            // Step 3: Done
            setTimeout(function () {
                cube.className = "easeOut"; // Switch to standard easing class
                introDone = true;
                startAutoRotate(); // Start auto rotation after intro
            }, 2600);
        }

        function showSwipeIcon() {
            if (!iconActive && !touching) {
                swipeTimeout = setTimeout(function() {
                     swipeIcon.classList.add('active');
                     iconActive = true;
                }, 2000); // Wait 2 seconds before showing
            }
        }

        function hideSwipeIcon() {
            if (swipeTimeout) clearTimeout(swipeTimeout);
            swipeIcon.classList.remove('active');
            iconActive = false;
        }

        // Renamed from reference's confusing structure
        function startAutoRotate() {
            stopAutoRotate(); // clear existing
            autoRotateInterval = setInterval(function () {
                if(!touching && introDone) {
                     cube.className = "easeInOut";
                     cubeScale(downScale, 0.3);

                     setTimeout(function () {
                         cubeScale(1, 0.4);
                     }, 300);

                     setTransitionDuration(0.8);
                     angle += 90;
                     applyTransform();
                }
            }, 3000); // Rotate every 3 seconds
        }

        function stopAutoRotate() {
            if(autoRotateInterval) clearInterval(autoRotateInterval);
        }

        function includeResizeMode() {
            window.onresize = function () {
                // Ideally debounced
                // cubeResize();
            }
        }

        function includeTiltMode() {
            if (window.DeviceMotionEvent) {
                window.ondevicemotion = function (e) {
                    if (!e.accelerationIncludingGravity) return;
                    var x = e.accelerationIncludingGravity.x;
                    var y = e.accelerationIncludingGravity.y;

                    var val = (Math.abs(window.orientation) === 90) ? y : x;

                    if (val > 3) tiltCube(15); // Tilt slightly
                    else if (val < -3) tiltCube(-15);
                }
            }
        }

        function tiltCube(delta) {
            if (introDone && !touching && !tilt) {
                tilt = true;
                // Just a small tilt visual, not changing 'angle' persistently
                // To keep it simple, we skip complex tilt logic for now or implement a simple bounce
                // angle += delta;
                // applyTransform();
                setTimeout(function(){ tilt = false; }, 500);
            }
        }

        function cubeScale(scale, duration) {
            cubeContainer.style.transitionDuration = duration + "s";
            cubeContainer.style.webkitTransitionDuration = duration + "s";

            var transform = "scale(" + scale + ")";
            cubeContainer.style.transform = transform;
            cubeContainer.style.webkitTransform = transform;
        }

        // Boot
        window.addEventListener('load', init);

    </script>
</body>
</html>
